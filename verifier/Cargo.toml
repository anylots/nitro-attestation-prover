[package]
name = "base-proof-tee-nitro-verifier"
description = "Pure verification logic for AWS Nitro Enclave attestation documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sha2 = { version = "0.10", default-features = false }
ciborium = "0.2"
thiserror = { version = "2.0", default-features = false }
serde_bytes = "0.11"
x509-parser = "0.17"
p384 = { version = "0.13", features = ["ecdsa"] }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
alloy-sol-types = { version = "1.6.0", default-features = false }
alloy-primitives = { version = "1.6.0", default-features = false }

[dev-dependencies]
hex = "0.4"
rstest = "0.26.1"

[lints]
workspace = true

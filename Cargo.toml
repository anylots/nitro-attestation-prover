[package]
name = "base-proof-tee-nitro-attestation-prover"
description = "Standalone ZK prover benchmark for AWS Nitro attestation documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "base-proof-tee-nitro-attestation-prover"
path = "src/main.rs"
required-features = ["prove"]

[workspace]
members = ["verifier"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"

[workspace.lints.rust]
missing-debug-implementations = "warn"
missing-docs = "warn"
unused-must-use = "deny"
rust-2018-idioms = "deny"

[workspace.lints.rustdoc]
all = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
thiserror = { version = "2.0", default-features = false }
tokio-util = "0.7.19"
async-trait = "0.1.83"
alloy-primitives = { version = "1.6.0", default-features = false }
base-proof-tee-nitro-verifier = { path = "verifier" }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"], optional = true }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"], optional = true }
# ZK / SP1
sp1-sdk = { git = "https://github.com/succinctlabs/sp1.git", tag = "v6.2.0", optional = true }
sp1-verifier = { git = "https://github.com/succinctlabs/sp1.git", tag = "v6.2.0", optional = true }

[dev-dependencies]
rstest = "0.26.1"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[features]
default = []
prove = ["dep:sp1-sdk", "dep:sp1-verifier", "dep:tokio", "dep:tracing-subscriber"]


[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1

[lints]
workspace = true
